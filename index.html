<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Specter — Car No. 1 Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-name">Specter</div>
      <div class="brand-sub">Car No. 1 Prototype</div>
    </div>
    <nav class="tabs">
      <button data-view="dashboard">Dashboard</button>
      <button data-view="car">Car No. 1</button>
      <button data-view="tooling">Tooling &amp; Process</button>
      <button data-view="tasks">Tasks</button>
      <button data-view="log">Build Log</button>
    </nav>
    <div class="updated" id="updated"></div>
  </aside>

  <main>
    <div class="view" id="dashboard"></div>
    <div class="view" id="car"></div>
    <div class="view" id="tooling"></div>
    <div class="view" id="tasks"></div>
    <div class="view" id="log"></div>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
